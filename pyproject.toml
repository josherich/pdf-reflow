[project]
name = "pdf-reflow"
version = "0.1.0"
description = "Reflow a PDF into a single-column mobile-sized PDF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "readings" }]
dependencies = [
    "pymupdf>=1.24",
]

[project.scripts]
pdf-reflow = "pdf_reflow.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_reflow"]

[tool.hatch.build.targets.sdist]
include = ["src/pdf_reflow", "tests", "README.md", "pyproject.toml"]

[dependency-groups]
dev = []
