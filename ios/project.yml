# XcodeGen spec — regenerate PDFReflow.xcodeproj with:
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# Useful when the hand-crafted project.pbxproj falls out of sync with
# new source files, or when you want to bump deployment targets.

name: PDFReflow

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  PDFReflow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PDFReflow
        excludes:
          - "ReflowBridge/**"
      # Add the ReflowBridge directory as a folder reference so its full
      # subtree (HTML, JS, pdf_reflow/, pymupdf.whl) is copied verbatim
      # into the app bundle.
      - path: PDFReflow/ReflowBridge
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.pdfreflow
        INFOPLIST_KEY_CFBundleDisplayName: PDF Reflow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"PDFReflow/Preview Content\""
    postBuildScripts:
      - name: Copy pdf_reflow assets into bundle
        runOnlyWhenInstalling: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          BRIDGE="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ReflowBridge"
          mkdir -p "$BRIDGE/pdf_reflow"
          cp -f "${SRCROOT}/../src/pdf_reflow/"*.py "$BRIDGE/pdf_reflow/"
          if [ -f "${SRCROOT}/../web/wheels/pymupdf.whl" ]; then
            cp -f "${SRCROOT}/../web/wheels/pymupdf.whl" "$BRIDGE/pymupdf.whl"
          else
            echo "warning: web/wheels/pymupdf.whl not found — build it first with web/build-pymupdf-wheel.sh" >&2
          fi
